name: Study validation (no signing or publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          cache-flutter: false
          cache-pub: false
          no-save-caches: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze study modules
        run: flutter analyze lib/data/study lib/components/study
      - name: Run study tests
        run: flutter test test/study
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app for later signing
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/study/Payload
          ditto build/ios/iphoneos/Runner.app build/study/Payload/Runner.app
          cd build/study
          ditto -c -k --keepParent Payload Study-UNSIGNED.ipa
          shasum -a 256 Study-UNSIGNED.ipa > SHA256.txt
          printf '%s\n' 'Unsigned build: must be signed before installing on iPhone.' > INSTALL-NOTE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Study-unsigned-iOS-app
          path: |
            build/study/Study-UNSIGNED.ipa
            build/study/SHA256.txt
            build/study/INSTALL-NOTE.txt
          if-no-files-found: error
          retention-days: 14
