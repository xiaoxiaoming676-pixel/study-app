name: Build Study iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - '.github/workflows/study-ios.yml'
      - 'BASE_COMMIT.txt'
permissions:
  contents: read
concurrency:
  group: study-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Checkout study changes
        uses: actions/checkout@v7
        with:
          path: study
          persist-credentials: false
      - name: Checkout pinned Saber source
        uses: actions/checkout@v7
        with:
          repository: saber-notes/saber
          ref: 5b396a40406c75835741f5c4555bc10ae816f121
          path: source
          persist-credentials: false
      - name: Apply study changes
        run: cp -R ../study/overlay/. .
      - name: Install pinned offline PPTX renderer
        run: |
          set -euo pipefail
          package=$(npm pack @aiden0z/pptx-renderer@1.3.0 --silent)
          mkdir -p /tmp/study-pptx-renderer
          tar -xzf "$package" -C /tmp/study-pptx-renderer
          renderer=/tmp/study-pptx-renderer/package/dist/aiden0z-pptx-renderer.browser.es.js
          printf '%s  %s\n' '46b61afa1435de0c194f93324c9467ca392c891c6e07517727c8ffb5e51c376b' "$renderer" | shasum -a 256 -c -
          npx --yes esbuild@0.25.12 "$renderer" --bundle --platform=browser \
            --format=iife --global-name=StudyPptx --minify --legal-comments=none \
            --outfile=assets/images/pptx_renderer.js
          printf '%s  %s\n' 'f83a58c6bcb652ea61456ce8ad6e5e49f10f7f6f4e9dd42f96c3be37a9706958' assets/images/pptx_renderer.js | shasum -a 256 -c -
          python3 - <<'PY'
          from pathlib import Path
          page = Path('assets/images/pptx_bridge.html')
          script = Path('assets/images/pptx_renderer.js').read_text(encoding='utf-8')
          source = page.read_text(encoding='utf-8')
          marker = '/* STUDY_RENDERER_SCRIPT */'
          assert source.count(marker) == 1 and '</script' not in script.lower()
          page.write_text(source.replace(marker, script), encoding='utf-8')
          PY
          rm assets/images/pptx_renderer.js
          cp /tmp/study-pptx-renderer/package/LICENSE assets/images/pptx_renderer.LICENSE
          cp ../study/overlay/tools/study/quality/fixtures/deck_complex.pptx assets/images/deck_complex.pptx
          curl --fail --location --silent --show-error \
            --output assets/images/real_corpus_illinois.pptx \
            https://doit-accessibility.github.io/exercises/powerpoint-example-1.pptx
          printf '%s  %s\n' \
            '7aa1d7668e39ee9949eded6f4a88ecafbb125de90ae342ab76b838d43f3e45c6' \
            assets/images/real_corpus_illinois.pptx | shasum -a 256 -c -
          mkdir -p /tmp/study-real-corpus
          curl --fail --location --silent --show-error \
            --output /tmp/study-real-corpus/illinois-office-supply.pdf \
            https://doit-accessibility.github.io/exercises/powerpoint-example-1.pdf
          printf '%s  %s\n' \
            'f5788c1f630044f4663b72900ca9c9bfc827b3be8252d4e80345daa2838ecc87' \
            /tmp/study-real-corpus/illinois-office-supply.pdf | shasum -a 256 -c -
          rm -f "$package"
      - name: Set study app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          data = project.read_text()
          assert data.count('com.adilhanney.saber') >= 3
          assert data.count('INFOPLIST_KEY_CFBundleDisplayName = Saber;') == 3
          data = data.replace('com.adilhanney.saber', 'com.xiaoxiaoming676.studyapp')
          data = data.replace('INFOPLIST_KEY_CFBundleDisplayName = Saber;', 'INFOPLIST_KEY_CFBundleDisplayName = Study;')
          project.write_text(data)
          plist = Path('ios/Runner/Info.plist')
          data = plist.read_text()
          assert data.count('<string>Saber</string>') == 2
          plist.write_text(data.replace('<string>Saber</string>', '<string>Study</string>'))
          PY
      - name: Set up pinned Flutter SDK
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 submodules/flutter
          git -C submodules/flutter switch -C stable
          flutter_revision=$(git -C submodules/flutter rev-parse HEAD)
          flutter_tag=$(git -C submodules/flutter ls-remote --tags origin | awk -v c="$flutter_revision" '$1 == c {sub(/refs\/tags\//, "", $2); print $2}')
          if [ -n "$flutter_tag" ]; then
            git -C submodules/flutter tag -f "$flutter_tag"
          fi
          echo "$PWD/submodules/flutter/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          flutter --version
          xcodebuild -version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze study modules
        run: flutter analyze lib/data/study lib/components/study lib/components/canvas/image/pdf_document_cache.dart lib/pages/editor/editor.dart lib/components/toolbar/editor_bottom_sheet.dart integration_test/study_flow_test.dart integration_test/pptx_offline_test.dart integration_test/large_pdf_test.dart test/study/pdf_document_cache_test.dart
      - name: Run study tests
        run: flutter test test/study
      - name: Boot available iPhone simulator
        run: |
          set -euo pipefail
          sim_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; candidates=[d for entries in data.values() for d in entries if d.get("isAvailable", True) and "iPhone" in d["name"]]; print(candidates[-1]["udid"] if candidates else "")')
          test -n "$sim_id" || { echo 'No iPhone simulator is available on this runner'; exit 1; }
          xcrun simctl boot "$sim_id" || true
          xcrun simctl bootstatus "$sim_id" -b
          echo "STUDY_SIM_ID=$sim_id" >> "$GITHUB_ENV"
      - name: Test import, notes, save and reading on iOS simulator
        id: flow
        continue-on-error: true
        timeout-minutes: 20
        run: flutter test integration_test/study_flow_test.dart -d "$STUDY_SIM_ID" --reporter expanded
      - name: Measure 120-page PDF import and recovery on iPhone simulator
        id: large_pdf_flow
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p build/study
          flutter test integration_test/large_pdf_test.dart -d "$STUDY_SIM_ID" --reporter expanded | tee build/study/large-pdf-test.log
          grep 'STUDY_LARGE_' build/study/large-pdf-test.log > build/study/large-pdf-metrics.txt
          test "$(wc -l < build/study/large-pdf-metrics.txt)" -eq 2
      - name: Upload synthetic large PDF metrics
        if: always() && steps.large_pdf_flow.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Study-large-PDF-simulator-metrics
          path: source/build/study/large-pdf-metrics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Test offline PPTX conversion on iPhone simulator
        id: pptx_flow
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p build/study
          flutter test integration_test/pptx_offline_test.dart -d "$STUDY_SIM_ID" --reporter expanded | tee build/study/pptx-test.log
          python3 ../study/overlay/tools/study/quality/extract_logged_pdf.py \
            build/study/pptx-test.log build/study/pptx-simulator.pdf
          python3 ../study/overlay/tools/study/quality/extract_logged_pdf.py \
            build/study/pptx-test.log build/study/pptx-real-simulator.pdf \
            --prefix STUDY_REAL_PDF
      - name: Set up Python for PPTX visual comparison
        if: steps.pptx_flow.outcome == 'success'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compare iPhone PDF with PowerPoint reference
        if: steps.pptx_flow.outcome == 'success'
        id: pptx_quality
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install PyMuPDF==1.26.6 Pillow==12.3.0
          test -s build/study/pptx-simulator.pdf
          python ../study/overlay/tools/study/quality/evaluate.py \
            build/study/pptx-simulator.pdf \
            --reference ../study/overlay/tools/study/quality/fixtures/deck_complex_powerpoint.pdf \
            --output build/study/pptx-quality.json
          python ../study/overlay/tools/study/quality/evaluate.py \
            build/study/pptx-real-simulator.pdf \
            --reference /tmp/study-real-corpus/illinois-office-supply.pdf \
            --output build/study/pptx-real-quality.json \
            --gate
          python - <<'PY'
          import json
          from pathlib import Path
          checks = json.loads(Path('build/study/pptx-quality.json').read_text())['checks']
          for name in ('page_count', 'aspect_ratio', 'mean_rgb_mae', 'worst_page_rgb_mae'):
              assert checks[name], f'PPTX visual check failed: {name}'
          PY
      - name: Upload synthetic PPTX comparison
        if: always() && steps.pptx_flow.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Study-PPTX-simulator-comparison
          path: |
            source/build/study/pptx-simulator.pdf
            source/build/study/pptx-quality.json
            source/build/study/pptx-real-simulator.pdf
            source/build/study/pptx-real-quality.json
            source/build/study/pptx-test.log
          if-no-files-found: warn
          retention-days: 14
      - name: Boot available iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$STUDY_SIM_ID" || true
          ipad_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; candidates=[d for entries in data.values() for d in entries if d.get("isAvailable", True) and d["name"].startswith("iPad")]; print(candidates[-1]["udid"] if candidates else "")')
          test -n "$ipad_id" || { echo 'No iPad simulator is available on this runner'; exit 1; }
          xcrun simctl boot "$ipad_id" || true
          xcrun simctl bootstatus "$ipad_id" -b
          echo "STUDY_IPAD_ID=$ipad_id" >> "$GITHUB_ENV"
      - name: Test study flow on iPad simulator
        id: ipad_flow
        continue-on-error: true
        timeout-minutes: 20
        run: flutter test integration_test/study_flow_test.dart -d "$STUDY_IPAD_ID" --reporter expanded
      - name: Test offline PPTX conversion on iPad simulator
        id: ipad_pptx_flow
        continue-on-error: true
        timeout-minutes: 15
        run: flutter test integration_test/pptx_offline_test.dart -d "$STUDY_IPAD_ID" --reporter expanded
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/study/Payload
          ditto build/ios/iphoneos/Runner.app build/study/Payload/Runner.app
          cd build/study
          ditto -c -k --keepParent Payload Study-UNSIGNED.ipa
          shasum -a 256 Study-UNSIGNED.ipa > SHA256.txt
          printf '%s\n' 'Unsigned: must be signed before installation on iPhone.' > INSTALL-NOTE.txt
      - name: Upload unsigned build
        uses: actions/upload-artifact@v7
        with:
          name: Study-unsigned-iOS-app
          path: |
            source/build/study/Study-UNSIGNED.ipa
            source/build/study/SHA256.txt
            source/build/study/INSTALL-NOTE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Build iOS simulator app for browser-based manual review
        run: flutter build ios --simulator --debug
      - name: Smoke test and package simulator app
        run: |
          set -euo pipefail
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app"
          xcrun simctl install "$STUDY_IPAD_ID" "$app"
          xcrun simctl launch "$STUDY_IPAD_ID" com.xiaoxiaoming676.studyapp
          ditto -c -k --keepParent "$app" build/study/Study-simulator-app.zip
          shasum -a 256 build/study/Study-simulator-app.zip > build/study/SIMULATOR-SHA256.txt
          printf '%s\n' 'Extract this artifact, then upload Study-simulator-app.zip to Appetize.' \
            > build/study/SIMULATOR-README.txt
      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Study-iOS-simulator-app
          path: |
            source/build/study/Study-simulator-app.zip
            source/build/study/SIMULATOR-SHA256.txt
            source/build/study/SIMULATOR-README.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce simulator test result
        if: steps.flow.outcome != 'success' || steps.large_pdf_flow.outcome != 'success' || steps.ipad_flow.outcome != 'success' || steps.pptx_flow.outcome != 'success' || steps.ipad_pptx_flow.outcome != 'success' || steps.pptx_quality.outcome != 'success'
        run: exit 1

