name: Build Study iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - '.github/workflows/study-ios.yml'
      - 'BASE_COMMIT.txt'
permissions:
  contents: read
concurrency:
  group: study-ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - name: Checkout study changes
        uses: actions/checkout@v7
        with:
          path: study
          persist-credentials: false
      - name: Checkout pinned Saber source
        uses: actions/checkout@v7
        with:
          repository: saber-notes/saber
          ref: 5b396a40406c75835741f5c4555bc10ae816f121
          path: source
          persist-credentials: false
      - name: Apply study changes
        run: cp -R ../study/overlay/. .
      - name: Install pinned offline PPTX renderer
        run: |
          set -euo pipefail
          package=$(npm pack @aiden0z/pptx-renderer@1.3.0 --silent)
          mkdir -p /tmp/study-pptx-renderer
          tar -xzf "$package" -C /tmp/study-pptx-renderer
          renderer=/tmp/study-pptx-renderer/package/dist/aiden0z-pptx-renderer.browser.es.js
          printf '%s  %s\n' '46b61afa1435de0c194f93324c9467ca392c891c6e07517727c8ffb5e51c376b' "$renderer" | shasum -a 256 -c -
          cp "$renderer" assets/images/pptx_renderer.js
          cp /tmp/study-pptx-renderer/package/LICENSE assets/images/pptx_renderer.LICENSE
          cp ../study/overlay/tools/study/quality/fixtures/deck_complex.pptx assets/images/deck_complex.pptx
          rm -f "$package"
      - name: Set study app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          data = project.read_text()
          assert data.count('com.adilhanney.saber') >= 3
          assert data.count('INFOPLIST_KEY_CFBundleDisplayName = Saber;') == 3
          data = data.replace('com.adilhanney.saber', 'com.xiaoxiaoming676.studyapp')
          data = data.replace('INFOPLIST_KEY_CFBundleDisplayName = Saber;', 'INFOPLIST_KEY_CFBundleDisplayName = Study;')
          project.write_text(data)
          plist = Path('ios/Runner/Info.plist')
          data = plist.read_text()
          assert data.count('<string>Saber</string>') == 2
          plist.write_text(data.replace('<string>Saber</string>', '<string>Study</string>'))
          PY
      - name: Set up pinned Flutter SDK
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 submodules/flutter
          git -C submodules/flutter switch -C stable
          flutter_revision=$(git -C submodules/flutter rev-parse HEAD)
          flutter_tag=$(git -C submodules/flutter ls-remote --tags origin | awk -v c="$flutter_revision" '$1 == c {sub(/refs\/tags\//, "", $2); print $2}')
          if [ -n "$flutter_tag" ]; then
            git -C submodules/flutter tag -f "$flutter_tag"
          fi
          echo "$PWD/submodules/flutter/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: |
          flutter --version
          xcodebuild -version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze study modules
        run: flutter analyze lib/data/study lib/components/study lib/pages/editor/editor.dart lib/components/toolbar/editor_bottom_sheet.dart integration_test/study_flow_test.dart integration_test/pptx_offline_test.dart
      - name: Run study tests
        run: flutter test test/study
      - name: Boot available iPhone simulator
        run: |
          set -euo pipefail
          sim_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; candidates=[d for entries in data.values() for d in entries if d.get("isAvailable", True) and "iPhone" in d["name"]]; print(candidates[-1]["udid"] if candidates else "")')
          test -n "$sim_id" || { echo 'No iPhone simulator is available on this runner'; exit 1; }
          xcrun simctl boot "$sim_id" || true
          xcrun simctl bootstatus "$sim_id" -b
          echo "STUDY_SIM_ID=$sim_id" >> "$GITHUB_ENV"
      - name: Test import, notes, save and reading on iOS simulator
        id: flow
        continue-on-error: true
        timeout-minutes: 20
        run: flutter test integration_test/study_flow_test.dart -d "$STUDY_SIM_ID" --reporter expanded
      - name: Test offline PPTX conversion on iPhone simulator
        id: pptx_flow
        continue-on-error: true
        timeout-minutes: 15
        run: flutter test integration_test/pptx_offline_test.dart -d "$STUDY_SIM_ID" --reporter expanded
      - name: Set up Python for PPTX visual comparison
        if: steps.pptx_flow.outcome == 'success'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compare iPhone PDF with PowerPoint reference
        if: steps.pptx_flow.outcome == 'success'
        id: pptx_quality
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install PyMuPDF==1.26.6 Pillow==12.3.0
          container=$(xcrun simctl get_app_container "$STUDY_SIM_ID" com.xiaoxiaoming676.studyapp data)
          output=$(find "$container/tmp" -maxdepth 1 -name 'study-*.pdf' -print -quit)
          test -n "$output" && test -f "$output"
          mkdir -p build/study
          cp "$output" build/study/pptx-simulator.pdf
          python ../study/overlay/tools/study/quality/evaluate.py \
            build/study/pptx-simulator.pdf \
            --reference ../study/overlay/tools/study/quality/fixtures/deck_complex_powerpoint.pdf \
            --output build/study/pptx-quality.json
          python - <<'PY'
          import json
          from pathlib import Path
          checks = json.loads(Path('build/study/pptx-quality.json').read_text())['checks']
          for name in ('page_count', 'aspect_ratio', 'mean_rgb_mae', 'worst_page_rgb_mae'):
              assert checks[name], f'PPTX visual check failed: {name}'
          PY
      - name: Upload synthetic PPTX comparison
        if: always() && steps.pptx_flow.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Study-PPTX-simulator-comparison
          path: |
            source/build/study/pptx-simulator.pdf
            source/build/study/pptx-quality.json
          if-no-files-found: warn
          retention-days: 14
      - name: Boot available iPad simulator
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$STUDY_SIM_ID" || true
          ipad_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; candidates=[d for entries in data.values() for d in entries if d.get("isAvailable", True) and d["name"].startswith("iPad")]; print(candidates[-1]["udid"] if candidates else "")')
          test -n "$ipad_id" || { echo 'No iPad simulator is available on this runner'; exit 1; }
          xcrun simctl boot "$ipad_id" || true
          xcrun simctl bootstatus "$ipad_id" -b
          echo "STUDY_IPAD_ID=$ipad_id" >> "$GITHUB_ENV"
      - name: Test study flow on iPad simulator
        id: ipad_flow
        continue-on-error: true
        timeout-minutes: 20
        run: flutter test integration_test/study_flow_test.dart -d "$STUDY_IPAD_ID" --reporter expanded
      - name: Test offline PPTX conversion on iPad simulator
        id: ipad_pptx_flow
        continue-on-error: true
        timeout-minutes: 15
        run: flutter test integration_test/pptx_offline_test.dart -d "$STUDY_IPAD_ID" --reporter expanded
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/study/Payload
          ditto build/ios/iphoneos/Runner.app build/study/Payload/Runner.app
          cd build/study
          ditto -c -k --keepParent Payload Study-UNSIGNED.ipa
          shasum -a 256 Study-UNSIGNED.ipa > SHA256.txt
          printf '%s\n' 'Unsigned: must be signed before installation on iPhone.' > INSTALL-NOTE.txt
      - name: Upload unsigned build
        uses: actions/upload-artifact@v7
        with:
          name: Study-unsigned-iOS-app
          path: |
            source/build/study/Study-UNSIGNED.ipa
            source/build/study/SHA256.txt
            source/build/study/INSTALL-NOTE.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce simulator test result
        if: steps.flow.outcome != 'success' || steps.ipad_flow.outcome != 'success' || steps.pptx_flow.outcome != 'success' || steps.ipad_pptx_flow.outcome != 'success' || steps.pptx_quality.outcome != 'success'
        run: exit 1
