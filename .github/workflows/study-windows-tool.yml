name: Build Study Windows textbook tool
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'overlay/tools/study/**'
      - 'build_windows_tool.ps1'
      - '.github/workflows/study-windows-tool.yml'
permissions:
  contents: read
jobs:
  textbook-tool:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: overlay/tools/study/requirements.txt
      - name: Build and smoke test standalone EXE
        shell: pwsh
        run: ./build_windows_tool.ps1
      - name: Test textbook preparation and synthetic corpus
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m unittest discover -s overlay/tools/study -p 'test_*.py' -v
      - name: Upload Windows tool
        uses: actions/upload-artifact@v7
        with:
          name: Study-Windows-textbook-tool
          path: |
            dist/windows-tool/StudyTextbookTool.exe
            dist/windows-tool/SHA256.txt
          if-no-files-found: error
          retention-days: 14
